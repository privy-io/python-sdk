# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to PyPI in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/privy-io/python-sdk/actions/workflows/publish-pypi.yml
name: Publish PyPI
on:
  # Manual retries must target an existing release tag, for example:
  # gh workflow run publish-pypi.yml --ref v0.8.0
  workflow_dispatch:

  release:
    types: [published]

# Keep the default token read-only. Only the publishing job may request an OIDC token.
permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.repository == 'privy-io/python-sdk' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # PyPI's trusted publisher must require this exact environment. That registry-side
    # binding prevents a branch copy of this workflow from removing the gate.
    environment: package-release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.9.13'

      - name: Publish to PyPI
        run: |
          bash ./bin/publish-pypi
